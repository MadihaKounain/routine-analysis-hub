{% extends "base.html" %}

{% block title %}Sign In - Routine Analytics Hub{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-120px)] w-full max-w-full mx-auto flex items-center justify-center">
    <div class="w-full max-w-md px-4 sm:px-0">
        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
            <!-- Decorative Header -->
            <div class="h-40 bg-gradient-to-br from-indigo-600 via-purple-500 to-pink-400 relative overflow-hidden">
                <div class="absolute inset-0 opacity-20">
                    <div
                        class="absolute top-0 left-1/4 w-96 h-96 bg-white rounded-full mix-blend-multiply filter blur-3xl">
                    </div>
                    <div
                        class="absolute -bottom-8 right-1/4 w-96 h-96 bg-white rounded-full mix-blend-multiply filter blur-3xl">
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="px-8 pb-8 -mt-20 relative">
                <!-- Icon -->
                <div class="flex justify-center mb-6">
                    <div
                        class="inline-flex h-16 w-16 items-center justify-center rounded-full bg-white shadow-xl border-4 border-indigo-100 text-2xl">
                        🔐
                    </div>
                </div>

                <h1 class="text-3xl font-bold text-center text-slate-900 mb-1">Welcome Back</h1>
                <p class="text-center text-slate-500 text-sm mb-8">Sign in to continue to your dashboard</p>

                {% if error %}
                <div
                    class="mb-6 rounded-lg bg-red-50 border-l-4 border-red-500 px-4 py-3 text-red-700 text-sm flex items-start gap-3">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Username or Email</label>
                        <input type="text" name="identity" required placeholder="Enter your username or email"
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition duration-200">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                        <input type="password" name="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition duration-200">
                    </div>

                    <button type="submit"
                        class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition duration-200 active:scale-95">
                        Sign In
                    </button>
                </form>

                <div class="mt-6 space-y-3">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-200"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-slate-500">New to Routine Analytics?</span>
                        </div>
                    </div>

                    <p class="text-center text-sm">
                        <a href="{{ url_for('auth.register') }}"
                            class="font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">Create an
                            account</a>
                    </p>
                </div>

                <div class="mt-6 pt-6 border-t border-slate-200">
                    <p class="text-center text-xs text-slate-500 mb-3">Admin Access</p>
                    <a href="{{ url_for('auth.admin_login') }}"
                        class="block w-full text-center px-4 py-2 rounded-lg border-2 border-slate-200 text-slate-700 font-medium hover:bg-slate-50 transition duration-200">
                        Admin Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
